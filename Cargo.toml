[package]
name = "click"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A Rust port of Python's Click library for creating command-line interfaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/msaraiva/click-rs"
keywords = ["cli", "command-line", "terminal", "arguments"]
categories = ["command-line-interface"]

[dependencies]
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.0"
