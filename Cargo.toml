[workspace]
members = [".", "click-derive"]
exclude = ["tests/parity/phase1/rust", "tests/parity/phase2/rust", "tests/parity/phase3/rust"]

[package]
name = "click-rs"
version = "1.0.1"
edition = "2021"
rust-version = "1.70"
description = "A Rust port of Python's Click library for creating command-line interfaces"
license = "MIT"
repository = "https://github.com/mrsaraiva/click-rs"
documentation = "https://docs.rs/click-rs"
readme = "README.md"
keywords = ["cli", "command-line", "terminal", "arguments"]
categories = ["command-line-interface"]
exclude = [
    ".idea/",
    "docs/devel/",
    "tests/parity/",
    "tools/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "click"

[dependencies]
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossterm = "0.28"
os_pipe = "1.2"
click-derive = { path = "./click-derive", version = "1.0.0", optional = true }
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3.0"
click-derive = { path = "./click-derive", version = "1.0.0" }

[features]
default = ["derive"]
derive = ["dep:click-derive"]

[[example]]
name = "inout"
path = "examples/inout.rs"

[[example]]
name = "colors"
path = "examples/colors.rs"

[[example]]
name = "validation"
path = "examples/validation.rs"

[[example]]
name = "completion"
path = "examples/completion.rs"

[[example]]
name = "naval"
path = "examples/naval.rs"

[[example]]
name = "complex"
path = "examples/complex.rs"

[[example]]
name = "aliases"
path = "examples/aliases.rs"

[[example]]
name = "repo"
path = "examples/repo.rs"

[[example]]
name = "termui"
path = "examples/termui.rs"

[[example]]
name = "imagepipe"
path = "examples/imagepipe.rs"
