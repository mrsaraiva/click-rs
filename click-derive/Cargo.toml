[package]
name = "click-derive"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Derive macros for click-rs CLI library"
license = "MIT"
repository = "https://github.com/mrsaraiva/click-rs"
documentation = "https://docs.rs/click-derive"
keywords = ["cli", "command-line", "derive", "macro"]
categories = ["command-line-interface", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
